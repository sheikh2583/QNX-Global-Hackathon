name: ci
# Same checks as .circleci/config.yml; the logic lives in scripts/ci.sh so any CI (or a laptop) runs it.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: unit tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: scripts/ci.sh tests

  bugzoo-hostcheck:
    # Type-checks every bug-zoo workload and reference fix with host gcc against
    # QNX API stubs (bugzoo/hostcheck/). No QNX license needed; qcc builds happen on the dev host.
    name: bug zoo compiles (host stubs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci.sh hostcheck

  trace-gate:
    # The CI contract TraceLens offers to QNX projects, demonstrated on the bug zoo:
    # clean traces must pass, every planted bug must fail the gate.
    name: real-time trace gate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: scripts/ci.sh gate
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracelens-reports
          path: reports/
