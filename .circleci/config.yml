# CircleCI (free plan): the same checks as .github/workflows/ci.yml, via scripts/ci.sh.
version: 2.1

executors:
  py:
    parameters:
      python:
        type: string
        default: "3.12"
    docker:
      - image: cimg/python:<< parameters.python >>

commands:
  setup:
    steps:
      - checkout
      - run:
          name: Install TraceLens
          command: pip install -e ".[dev]"

jobs:
  unit-tests:
    parameters:
      python:
        type: string
    executor:
      name: py
      python: << parameters.python >>
    steps:
      - setup
      - run:
          name: Unit tests + synthetic fixtures match the generator
          command: scripts/ci.sh tests
      - store_test_results:
          path: reports

  bugzoo-hostcheck:
    executor: py
    steps:
      - checkout
      - run:
          name: Bug zoo compiles against QNX API stubs (no QNX license)
          command: |
            command -v gcc >/dev/null || { sudo apt-get update && sudo apt-get install -y build-essential; }
            scripts/ci.sh hostcheck

  trace-gate:
    executor: py
    steps:
      - setup
      - run:
          name: Real-time trace gate (real QNX 8.0 + synthetic traces)
          command: scripts/ci.sh gate
      - store_artifacts:
          path: reports
          destination: tracelens-reports

workflows:
  ci:
    jobs:
      - unit-tests:
          matrix:
            parameters:
              python: ["3.11", "3.12", "3.13"]
      - bugzoo-hostcheck
      - trace-gate:
          requires:
            - unit-tests
