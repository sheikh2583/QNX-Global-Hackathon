# TraceLens configuration for the bug zoo on the *aarch64 emulated* guest (docs/results/aarch64.md).
#
# This is NOT a loosened copy of bugzoo/tracelens.toml for convenience: that file is calibrated for the
# KVM-accelerated x86_64 guest every published number comes from and stays as it is. An aarch64 image
# on an x86 host has no KVM, so QEMU interprets every instruction (TCG) and wake-ups land later.
#
# Only the three deadline budgets and the two interrupt thresholds differ; every other threshold is identical. Measured on the aarch64 guest
# (data in docs/results/aarch64.md section 4): the reference fixes still miss 1-2 jobs in 200 (z4: 1 in
# 800) by up to 0.84 ms (worst reference response 2.84 ms against a 2 ms budget; 5.12 ms against 4 ms),
# with p99 release jitter 0.8-1.2 ms against ~0.7 ms on x86. Each budget below is that worst reference
# response plus ~0.7 ms. The planted bugs miss by far more (p99 response 5.9-8.4 ms; one lossy z1
# trace 17.8 ms), so the bug/fix separation does not depend on the budget.

fail_on = "high"

[thresholds]
inversion_min_block_us = 1000
inversion_min_interference_us = 500
contention_min_share = 0.05
contention_p99_wait_us = 1000
contention_min_waits = 5
# Interrupt thresholds (the x86 values are 1000 and 500). On the aarch64 guest the interrupt source is the
# virtio disk (docs/results/aarch64.md section 6) and a healthy handler doing 50 us of work measures p99
# 450-1,360 us wake-to-unmask and 1.1-3.0 ms interrupt-to-wake: emulation jitter, not the handler.
# Rule, fixed before the test batch was captured: 1.25 x the worst healthy per-trace p99 in the
# calibration batch (6 healthy traces, seed 7), rounded up to 100 us: handler 1.25 x 1,881 -> 2,400;
# latency 1.25 x 2,964 -> 3,700. Scored on a second batch (seed 8) that was not used to choose them:
# 0/8 healthy flagged but also 0/4 planted overruns (1.0-1.9 ms of work, p99 1.6-2.4 ms): six healthy
# traces were too few, and these thresholds only separate large overruns (z5: 10/10, 0/10 false).
# Do not read them as a validated calibration.
irq_max_latency_us = 3700
irq_max_handler_us = 2400
deadlock_min_blocked_us = 50000

[deadlines.control]   # z1 infusion pump: dose computation every 10 ms (x86: 2000)
budget_us = 3500
period_us = 10000

[deadlines.brake]     # z2 brake-by-wire: request round trip every 10 ms (x86: 2000)
budget_us = 3500
period_us = 10000

[deadlines.frame]     # z4 camera pipeline: per-worker tile every 10 ms (x86: 4000)
budget_us = 6000
period_us = 10000
