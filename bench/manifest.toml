# Real-bug benchmark manifest (research track R3). Metadata only: no upstream code is stored here.
#
# Inclusion criteria (also in docs/research/PROTOCOL.md, E3):
#   - C or C++ using POSIX threads, semaphores, condition variables, message queues, timers or QNX APIs
#   - builds with qcc for QNX 8.0 through headers/shims only, no edits to upstream lines
#   - the bug shows up as scheduling behaviour: hang, deadlock, priority inversion, lost wake-up, starvation, latency
#   - ground truth exists: an upstream issue or commit describing it, ideally with the developer's fix
#   - the licence allows redistribution, or the file is fetched by hash
# status: candidate | reproduced | excluded.  "tool_frozen_before_driver" is false for the case studies (ttk4147, memcached-1348, nng-1813: worked on
# before any freeze tag existed, so CASE STUDIES, not blind results) and true for the three blind-test entries, which were all
# EXCLUDED because none reproduced: no blind result exists yet (see docs/research/CLAIMS.md).
# Every field marked (verify) has not been checked against the primary source.

