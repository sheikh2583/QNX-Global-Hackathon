[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tracelens"
version = "0.1.0.dev0"
description = "Find, fix and prove real-time bugs from QNX kernel event traces"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []  # core is stdlib-only on purpose: judges can run it anywhere

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
tracelens = "tracelens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tracelens = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
