# TraceLens configuration for the bug zoo (real QNX captures).
# Deadline names match the TL_JOB_START/TL_JOB_END markers emitted by each workload.

fail_on = "high"

[thresholds]
inversion_min_block_us = 1000
inversion_min_interference_us = 500
contention_min_share = 0.05
contention_p99_wait_us = 1000
contention_min_waits = 5
# Interrupt-to-handler latency on WSL2 -> KVM -> QEMU measured p99 ~315 us for a correct handler under
# heavy serial load (2026-11-14), so the bug zoo's budget sits above that noise floor.
irq_max_latency_us = 1000
irq_max_handler_us = 500
deadlock_min_blocked_us = 50000

[deadlines.control]   # z1 infusion pump: dose computation every 10 ms
# 2 ms, not 1: the job runs ~0.12 ms, and on the QEMU VM wake-ups land up to ~0.7 ms late and
# execution stalls add more (measured). Keep >= ~2 ms of slack over that noise (PLAN.md §15).
budget_us = 2000
period_us = 10000

[deadlines.brake]     # z2 brake-by-wire: request round trip every 10 ms
budget_us = 2000
period_us = 10000

[deadlines.frame]     # z4 camera pipeline: per-worker tile every 10 ms
# QNX 8.0 has a fixed 1 ms tick and absolute sleeps wake ~1.1-1.4 ms late (measured), so budgets
# keep >= 2 ms of slack over the work (1.5 ms) to stay above the platform's noise floor.
budget_us = 4000
period_us = 10000
